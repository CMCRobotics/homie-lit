name: CI/CD

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

jobs:

  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    
    - name: Install dependencies
      run: bun install --frozen-lockfile
    
    - name: Run unit tests
      run: bun test --path-ignore-patterns integrationtest
 
    # - name: Start Mosquitto
    #   uses: namoshek/mosquitto-github-action@v1
    #   with:
    #     version: '1.6'
    #     ports: '1883:1883'
    #     container-name: 'mqtt'

    # - name: Run integration tests
    #   run: bun test integrationtest/
    #   env:
    #     MQTT_BROKER_URL: mqtt://localhost:1883
    
    - name: Build
      run: bun run build

    - name: Get package info
      id: package-info
      run: |
        echo "PKG_NAME=$(bun -e 'console.log(require("./package.json").name)')" >> $GITHUB_OUTPUT
        echo "PKG_VERSION=$(bun -e 'console.log(require("./package.json").version)')" >> $GITHUB_OUTPUT

    - name: Publish to GitHub Packages
      run: |
        # Setup .npmrc for GitHub Packages authentication
        echo "@cmcrobotics:registry=https://npm.pkg.github.com" > .npmrc
        echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

        publish_snapshot_package() {
          local TAG=$1
          
          NEW_VERSION=${{ steps.package-info.outputs.PKG_VERSION }}-$TAG.${{ github.run_number }}
          echo "Publishing new version: $NEW_VERSION"
          bun -e "const fs = require('fs'); const pkg = require('./package.json'); pkg.version = '$NEW_VERSION'; fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"
          npm publish
          npm dist-tag add ${{ steps.package-info.outputs.PKG_NAME }}@$NEW_VERSION $TAG
        }

        if [[ $GITHUB_REF == refs/heads/main ]]; then
          # Publishing from main branch
          publish_snapshot_package "stable"
        elif [[ $GITHUB_REF == refs/heads/develop ]]; then
          # Publishing from develop branch
          publish_snapshot_package "dev"
        elif [[ $GITHUB_REF == refs/tags/* ]]; then
          # Publishing from a tag
          VERSION=${GITHUB_REF#refs/tags/v}
          npm publish
          npm dist-tag add ${{ steps.package-info.outputs.PKG_NAME }}@$VERSION "stable"
        fi
      env:
        NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

  create-release:
    needs: build-test-publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
